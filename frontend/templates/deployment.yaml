apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-frontend
  namespace: expense
  labels:    # These are ReplicaSet labels
    project: expense
    enviroment: dev
    module: frontend
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: frontend
# This is Pod definition
  template:
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        module: frontend
    spec:
      containers:
      - name: frontend
        image: ganeshguntamadugu/frontend:{{ .Values.deployment.imageVersion }}
        resources:
          requests:
            cpu: "100m"
            memory: "120Mi"
          limits:
            cpu: "150m"
            memory: "160Mi"