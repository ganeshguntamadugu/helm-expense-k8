apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: expense-backend-hpa
  namespace: expense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expense-backend
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: {{ .Values.hpa.CPUUtilizationPercentage }}